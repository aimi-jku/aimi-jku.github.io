name: Fetch publications
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_publications.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          MEMBERS: ${{ secrets.MEMBERS }}
        run: python scripts/fetch_publications.py

      - name: Commit updated bibliography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _bibliography/papers.bib

          if git diff --cached --quiet; then
            echo "No changes to papers.bib"
          else
            git commit -m "updated papers.bib"
            git push
          fi